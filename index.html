<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Picture This!</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header class="header">
    <div class="title">
      <h1>Picture This!</h1>
      <h4>My Really Cool Blog Post</h4>
    </div>
    
    <!-- add picture to control the size of the image in different screens' sizes -->
    <picture>
      <!-- if screen is at least 960px wide, use square images -->
      <source media="(min-width: 1600px)"
            srcset="images/museum-800x800.jpg 1x,
            images/museum-1600x1600.jpg 2x,
            images/museum-2400x2400.jpg 3x">

      <source media="(min-width: 1280px)"
            srcset="images/museum-640x640.jpg 1x,
            images/museum-1280x1280.jpg 2x,
            images/museum-1920x1920.jpg 3x">

      <source media="(min-width: 960px)"
            srcset="images/museum-480x480.jpg 1x,
            images/museum-960x960.jpg 2x,
            images/museum-1440x1440.jpg 3x">


      <!-- if screen is less than 960px wide, use landscape images -->
      <source media="(max-width: 320px)"
            srcset="images/museum-320x180.jpg 1x,
            images/museum-640x360.jpg 2x,
            images/museum-960x540.jpg 3x">
      
      <source media="(max-width: 480px)"
            srcset="images/museum-480x270.jpg 1x,
            images/museum-960x540.jpg 2x,
            images/museum-1440x810.jpg 3x">

      <source media="(max-width: 720px)"
            srcset="images/museum-720x405.jpg 1x,
            images/museum-1440x810.jpg 2x,
            images/museum-2160x1215.jpg 3x">

      <img src="images/museum-960x540.jpg"
            srcset="images/museum-960x540.jpg 1x,
            images/museum-1920x1080.jpg 2x,
            images/museum-2880x1620.jpg 3x"
            alt="placeholder">
      </picture>


  </header>
</body>

</html>
